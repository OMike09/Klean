<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KLEAN — Agent de terrain</title>
<link rel="icon" href="/klean-icon-192.png">
<style>
:root{--p:#15c98a;--pd:#0da678;--bg:#0b1512;--card:#122019;--line:#1e332a;--ink:#e8f2ed;--muted:#7f948a}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;padding:16px}
input,button{font:inherit}input{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#16261f;color:var(--ink);margin-bottom:8px}
.btn{width:100%;background:var(--p);color:#04130c;font-weight:900;padding:12px;border:none;border-radius:12px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h1{font-size:18px;margin-bottom:10px}.note{font-size:12px;color:var(--muted);margin-bottom:10px}
.hidden{display:none!important}
</style></head><body>
<div id="gate" class="card">
  <h1>Espace Agent terrain</h1>
  <p class="note" style="text-align:center;font-weight:800;letter-spacing:.3px">KLEAN-SERVICES CI</p>
  <input id="tel" placeholder="📞 Téléphone" type="tel">
  <input id="pw" placeholder="🔑 Mot de passe" type="password">
  <button class="btn" onclick="login()">Entrer</button>
</div>
<div id="app" class="hidden">
  <h1>🧭 <span id="hello"></span></h1>
  <div class="card">
    <b>👤 Nouveau client</b>
    <input id="c-nom" placeholder="Nom *">
    <input id="c-tel" placeholder="Téléphone *" type="tel">
    <input id="c-ville" placeholder="Ville">
    <button class="btn" onclick="mk('client')">Créer le client</button>
  </div>
  <div class="card">
    <b>🧑‍💼 Nouveau professionnel</b>
    <input id="p-prenom" placeholder="Prénom *">
    <input id="p-nom" placeholder="Nom *">
    <input id="p-tel" placeholder="Téléphone *" type="tel">
    <input id="p-ville" placeholder="Ville">
    <button class="btn" onclick="mk('pro')">Créer le pro</button>
  </div>
  <div class="card">
    <b>💬 Écrire au PDG / gestionnaire</b>
    <p class="note">Il voit votre message dans le HQ et peut vous répondre ici.</p>
    <div id="msgs" style="max-height:240px;overflow:auto;font-size:13px;margin:8px 0;min-height:80px"></div>
    <input id="m" placeholder="Votre message" onkeydown="if(event.key==='Enter'){event.preventDefault();send();}">
    <button class="btn" onclick="send()">Envoyer</button>
  </div>
  <button class="btn" style="background:#1e332a;color:var(--ink)" onclick="fetch('/api/logout',{method:'POST'});location.reload()">Sortir</button>
</div>
<script>
async function login(){
  const r=await fetch('/api/field/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tel:tel.value,password:pw.value})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) return alert(d.error||'Refusé');
  hello.textContent=d.nom; gate.classList.add('hidden'); app.classList.remove('hidden'); loadChat();
}
async function mk(kind){
  if(kind==='client'){
    const r=await fetch('/api/field/clients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nom:document.getElementById('c-nom').value,tel:document.getElementById('c-tel').value,ville:document.getElementById('c-ville').value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) return alert(d.error||'Erreur');
    alert('CLIENT CRÉÉ\\nTél : '+d.tel+'\\nMot de passe : '+d.password);
  } else {
    const r=await fetch('/api/field/agents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prenom:document.getElementById('p-prenom').value,nom:document.getElementById('p-nom').value,tel:document.getElementById('p-tel').value,ville:document.getElementById('p-ville').value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) return alert(d.error||'Erreur');
    alert('PRO CRÉÉ\\nTél : '+d.tel+'\\nCode liaison : '+d.pin);
  }
}
async function loadChat(){
  const r=await fetch('/api/field/chat'); if(!r.ok) return;
  const d=await r.json();
  msgs.innerHTML=(d.messages||[]).map(m=>{
    const mine=m.from==='field';
    const who=mine?'vous':(m.par||m.gestNom||'PDG');
    const t=(m.at||'').slice(11,19);
    return '<div style="margin:6px 0;text-align:'+(mine?'right':'left')+'"><span style="display:inline-block;max-width:88%;background:'+(mine?'#1e332a':'#16261f')+';border-radius:11px;padding:7px 10px">'+(m.text||'')+'<small style="display:block;opacity:.7">'+who+' · '+t+'</small></span></div>';
  }).join('')||'<span class="note">Aucun message — écrivez, le PDG verra.</span>';
  msgs.scrollTop=msgs.scrollHeight;
}
async function send(){
  const t=m.value.trim(); if(!t) return;
  await fetch('/api/field/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
  m.value=''; loadChat();
}
setInterval(loadChat, 4000);
</script>
</body></html>
